# The database's master credentials were generated by RDS and live in AWS Secrets Manager.
# Read them here and hand them to Vault, so pods have one place to get secrets from.
- name: Read the database credentials from Secrets Manager
  ansible.builtin.command:
    argv: [aws, secretsmanager, get-secret-value, --region, "{{ database.secret_region }}",
           --secret-id, "{{ database.secret_arn }}", --query, SecretString, --output, text]
  register: db_secret
  when: database.host | default('') | length > 0
  no_log: true
  changed_when: false

# The configuration is one shell script (files/vault-configure.sh) run inside the Vault pod.
# The token and the database password go in on standard input, so they never appear in a
# command line or in the log. Values are base64-encoded so no character can break the shell.
- name: Configure the secrets engine, Kubernetes auth, policy, role and secrets
  ansible.builtin.command:
    argv: "{{ vault_exec_stdin }}"
    stdin: |
      export VAULT_TOKEN='{{ vault_init.root_token }}'
      {% if db_secret.stdout is defined %}
      export DB_HOST='{{ database.host }}' DB_PORT='{{ database.port }}' DB_NAME='{{ database.name }}'
      export DB_USER_B64='{{ (db_secret.stdout | from_json).username | b64encode }}'
      export DB_PASSWORD_B64='{{ (db_secret.stdout | from_json).password | b64encode }}'
      {% endif %}
      {{ lookup('ansible.builtin.file', playbook_dir ~ '/../files/vault-configure.sh') }}
  register: vault_configure
  no_log: true
  changed_when: "'CHANGED' in vault_configure.stdout"

- name: Show what the script reported
  ansible.builtin.debug:
    msg: "{{ vault_configure.stdout_lines | select('match', '^(OK|CHANGED)') | list }}"
