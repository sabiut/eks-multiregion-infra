# Variables for the EKS clusters. Everything cluster-specific comes from Terraform's outputs:
# the pipeline runs `scripts/handoff.sh <region>` after the apply, which writes the outputs
# of the cluster stack and of the database stack to JSON files, and this file reads them.
# Those JSON files are the handoff between the tools.
tf: "{{ lookup('ansible.builtin.file', playbook_dir ~ '/../.tfout/' ~ region ~ '.json') | from_json }}"
tfdb: "{{ lookup('ansible.builtin.file', playbook_dir ~ '/../.tfout/' ~ region ~ '-database.json') | from_json }}"

cluster_name: "{{ tf.cluster_name.value }}"
kube_context: "{{ tf.cluster_name.value }}"
cluster_dir: "{{ region }}" # clusters/<cluster_dir>/ in the GitOps repository

# Passed to Argo CD as Helm values (see roles/root_app). The GitOps repository uses them where
# a value differs per cluster and should not be committed, such as the account ID.
cluster_values:
  name: "{{ tf.cluster_name.value }}"
  region: "{{ region }}"
  accountId: "{{ tf.account_id.value }}"
  registry: "{{ tf.account_id.value }}.dkr.ecr.{{ region }}.amazonaws.com"
  vpcCidr: "{{ tf.vpc_cidr.value }}"
  karpenterQueue: "{{ tf.karpenter_queue.value }}"
  karpenterNodeRole: "{{ tf.karpenter_node_role.value }}"
  veleroBucket: "{{ tf.velero_bucket.value }}"
  vaultKmsAlias: "{{ tf.vault_kms_alias.value }}"

# The database tier, from the database stack's own outputs (not passed through another
# stack, so they are never out of date). Ansible reads the credentials from Secrets Manager
# and writes them into Vault (roles/vault_config).
database:
  host: "{{ tfdb.db_host.value }}"
  port: "{{ tfdb.db_port.value }}"
  name: "{{ tfdb.db_name.value }}"
  secret_arn: "{{ tfdb.db_secret_arn.value }}"
  secret_region: "{{ tfdb.db_secret_region.value }}"

# Where the Vault init output (recovery keys, first root token) is kept.
vault_init_store: secretsmanager
vault_init_secret: "{{ tf.cluster_name.value }}/vault-init"
